<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taiwan Real Estate Dashboard 台灣六都實價登錄趨勢</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- DataTables + Bootstrap 5 skin -->
  <link
    href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css"
    rel="stylesheet"
  />

  <style>
    :root {
      --rise-bg:  #ffe0e0;   /* positive QoQ/YoY → red tint  (price rose)   */
      --fall-bg:  #d4f5d4;   /* negative QoQ/YoY → green tint (price fell)  */
      --rise-txt: #8b0000;
      --fall-txt: #1a5e1a;
    }

    body { background: #f7f8fa; }

    #header-bar {
      background: linear-gradient(135deg, #c0392b 0%, #922b21 100%);
      color: #fff;
      padding: 1rem 1.5rem;
    }
    #header-bar h1 { font-size: 1.4rem; margin: 0; }
    #header-bar small { opacity: .8; font-size: .85rem; }

    .nav-tabs .nav-link        { color: #555; }
    .nav-tabs .nav-link.active { font-weight: 700; color: #c0392b; }

    /* Conditional cell colouring */
    .cell-rise { background-color: var(--rise-bg) !important; color: var(--rise-txt); font-weight: 600; }
    .cell-fall { background-color: var(--fall-bg) !important; color: var(--fall-txt); font-weight: 600; }

    .district-link { cursor: pointer; color: #1a6db5; text-decoration: underline; }
    .district-link:hover { color: #c0392b; }

    #detail-table-wrap { display: none; }

    .back-btn { margin-bottom: .75rem; }

    .spinner-wrap { text-align: center; padding: 3rem; color: #888; }

    /* Make DataTables header sticky inside card */
    .dataTables_wrapper .dataTables_scrollHead { background: #fff; }

    footer { font-size: .78rem; color: #aaa; text-align: center; padding: 2rem 0; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<div id="header-bar">
  <h1>🏙️ Taiwan Real Estate Dashboard &nbsp;|&nbsp; 台灣六都實價登錄趨勢</h1>
  <small id="data-period">Loading data…</small>
</div>

<!-- ── City Tabs ───────────────────────────────────────────────────────────── -->
<div class="container-fluid mt-3">
  <ul class="nav nav-tabs" id="city-tabs" role="tablist"></ul>

  <div class="tab-content mt-2" id="city-tab-content"></div>
</div>

<!-- ── Detail Drill-down (shown when a district row is clicked) ────────────── -->
<div class="container-fluid mt-3" id="detail-table-wrap">
  <button class="btn btn-outline-secondary btn-sm back-btn" id="back-btn">
    ← Back to Summary
  </button>
  <h5 id="detail-title" class="mb-2"></h5>
  <div class="card shadow-sm p-3">
    <table id="detail-table" class="table table-sm table-bordered table-hover w-100">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- ── Footer ──────────────────────────────────────────────────────────────── -->
<footer>
  Data source: MOI 內政部不動產成交案件實際資訊資料供應系統 &nbsp;|&nbsp;
  Red = price ↑ &nbsp; Green = price ↓ &nbsp;|&nbsp;
  Generated by <a href="https://github.com" target="_blank">GitHub Actions</a>
</footer>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
/* ── Utility ────────────────────────────────────────────────────────────── */

/** Parse a CSV URL and return Promise<array of objects> */
function loadCSV(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download:       true,
      header:         true,
      skipEmptyLines: true,
      complete: r => resolve(r.data),
      error:    e => reject(e),
    });
  });
}

/** Format a number with 2 decimal places, or '—' if missing. */
function fmt(v, decimals = 2) {
  const n = parseFloat(v);
  return isNaN(n) ? '—' : n.toFixed(decimals);
}

/** Build a CSS class for a growth-rate cell. */
function growthClass(v) {
  const n = parseFloat(v);
  if (isNaN(n) || n === 0) return '';
  return n > 0 ? 'cell-rise' : 'cell-fall';
}

/** Format a growth percentage with sign, or '—'. */
function fmtPct(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}

/* ── Globals ─────────────────────────────────────────────────────────────── */

let manifest = null;
let summaryDT = null;    // active DataTables instance for summary
let detailDT  = null;    // active DataTables instance for detail
let activeCity = null;   // currently selected city folder name

/* ── Summary table ──────────────────────────────────────────────────────── */

function buildSummaryColumns(sample) {
  /* Detect which growth columns exist in the data */
  const keys   = Object.keys(sample || {});
  const hasQoQ = keys.includes('QoQ_pct');
  const hasYoY = keys.includes('YoY_pct');

  const cols = [
    {
      title: 'District 行政區',
      data:  'District',
      render: (d) =>
        `<span class="district-link" data-district="${encodeURIComponent(d)}">${d}</span>`,
    },
    { title: 'Quarter 季度',         data: 'Quarter' },
    {
      title: 'Avg Price/Ping<br><small>萬/坪</small>',
      data:  'AvgPricePerPing',
      render: d => fmt(d),
    },
    {
      title: 'Transactions<br><small>成交件數</small>',
      data:  'TransactionCount',
      render: d => fmt(d, 0),
    },
  ];

  if (hasQoQ) {
    cols.push({
      title: 'QoQ 季增率',
      data:  'QoQ_pct',
      render: d => fmtPct(d),
      createdCell(td, cellData) {
        const cls = growthClass(cellData);
        if (cls) $(td).addClass(cls);
      },
    });
  }
  if (hasYoY) {
    cols.push({
      title: 'YoY 年增率',
      data:  'YoY_pct',
      render: d => fmtPct(d),
      createdCell(td, cellData) {
        const cls = growthClass(cellData);
        if (cls) $(td).addClass(cls);
      },
    });
  }
  return cols;
}

async function loadSummary(cityCode) {
  const city = manifest.cities[cityCode];
  activeCity = city.folder;

  const paneId = `pane-${city.folder}`;
  const wrap   = $(`#${paneId}`);

  wrap.html(`<div class="spinner-wrap">⏳ Loading ${city.name} summary…</div>`);

  // Destroy previous instance to avoid DataTables id conflicts
  if (summaryDT) {
    summaryDT.destroy();
    summaryDT = null;
  }

  let rows;
  try {
    rows = await loadCSV(`data/${city.folder}/summary.csv`);
  } catch (e) {
    wrap.html(`<div class="alert alert-warning mt-3">No data yet for ${city.name}. Run the pipeline first.</div>`);
    return;
  }

  if (!rows.length) {
    wrap.html(`<div class="alert alert-info mt-3">Summary file is empty.</div>`);
    return;
  }

  const tableId = `tbl-${city.folder}`;
  wrap.html(`
    <div class="card shadow-sm p-3 mt-2">
      <table id="${tableId}" class="table table-sm table-bordered table-hover w-100"></table>
    </div>
    <p class="text-muted mt-2" style="font-size:.8rem">
      💡 Click a district name to see transaction details.
      &nbsp; Red = price rose &nbsp; Green = price fell.
    </p>
  `);

  const cols = buildSummaryColumns(rows[0]);

  summaryDT = $(`#${tableId}`).DataTable({
    data:      rows,
    columns:   cols,
    order:     [[1, 'desc'], [0, 'asc']],   // newest quarter first
    pageLength: 25,
    dom: '<"row"<"col-sm-6"l><"col-sm-6"f>>rtp',
    language: { search: 'Search 搜尋:' },
  });
}

/* ── Detail drill-down ───────────────────────────────────────────────────── */

function buildDetailColumns(sample) {
  const map = {
    District:          'District 行政區',
    Road:              'Road 道路',
    Floor:             'Floor 樓層',
    FloorCategory:     'Tier 樓層類別',
    BuildingType:      'Type 建物型態',
    TotalPrice_10kTWD: 'Total Price 總價(萬)',
    PricePerPing:      'Price/Ping 萬/坪',
    Quarter:           'Quarter 季度',
    Status:            'Status 狀態',
  };
  return Object.entries(map)
    .filter(([k]) => k in sample)
    .map(([k, title]) => ({
      title,
      data: k,
      render: ['TotalPrice_10kTWD', 'PricePerPing'].includes(k)
        ? d => fmt(d)
        : d => (d == null || d === '' ? '—' : d),
    }));
}

async function loadDetail(cityFolder, districtEncoded) {
  const district = decodeURIComponent(districtEncoded);
  $('#detail-title').text(`${cityFolder} › ${district} — Transaction Details`);
  $('#detail-table-wrap').show();
  $('html, body').animate({ scrollTop: $('#detail-table-wrap').offset().top - 60 }, 300);

  if (detailDT) {
    detailDT.destroy();
    detailDT = null;
    $('#detail-table thead').empty();
    $('#detail-table tbody').empty();
  }

  let rows;
  try {
    rows = await loadCSV(`data/${cityFolder}/${districtEncoded}.csv`);
  } catch (e) {
    $('#detail-table-wrap').hide();
    alert(`Could not load detail data for ${district}.`);
    return;
  }

  if (!rows.length) {
    $('#detail-table tbody').html('<tr><td colspan="9">No records found.</td></tr>');
    return;
  }

  const cols = buildDetailColumns(rows[0]);

  detailDT = $('#detail-table').DataTable({
    data:      rows,
    columns:   cols,
    order:     [],
    pageLength: 25,
    dom: '<"row"<"col-sm-6"l><"col-sm-6"f>>rtp',
    language:  { search: 'Search 搜尋:' },
  });
}

/* ── Tab setup ───────────────────────────────────────────────────────────── */

const CITY_ORDER = ['A', 'F', 'H', 'B', 'D', 'E'];

function buildTabs(mf) {
  const tabList  = $('#city-tabs');
  const tabPanes = $('#city-tab-content');

  CITY_ORDER.forEach((code, idx) => {
    const city   = mf.cities[code];
    const paneId = `pane-${city.folder}`;
    const tabId  = `tab-${city.folder}`;

    tabList.append(`
      <li class="nav-item" role="presentation">
        <button
          class="nav-link ${idx === 0 ? 'active' : ''}"
          id="${tabId}"
          data-bs-toggle="tab"
          data-bs-target="#${paneId}"
          data-city-code="${code}"
          type="button"
          role="tab"
        >${city.name}</button>
      </li>
    `);

    tabPanes.append(`
      <div
        class="tab-pane fade ${idx === 0 ? 'show active' : ''}"
        id="${paneId}"
        role="tabpanel"
      >
        <div class="spinner-wrap">⏳ Click the tab to load data…</div>
      </div>
    `);
  });
}

/* ── Event delegation ────────────────────────────────────────────────────── */

// Load summary when a tab is shown
$(document).on('shown.bs.tab', 'button[data-city-code]', function () {
  const code = $(this).data('city-code');
  loadSummary(code);
});

// Drill into district detail when a district link is clicked
$(document).on('click', '.district-link', function () {
  const district = $(this).data('district');
  if (activeCity) loadDetail(activeCity, district);
});

// Back to summary
$('#back-btn').on('click', () => {
  $('#detail-table-wrap').hide();
  $('html, body').animate({ scrollTop: 0 }, 200);
});

/* ── Bootstrap ───────────────────────────────────────────────────────────── */

$(async function () {
  let mf;
  try {
    const resp = await fetch('data/manifest.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    mf = await resp.json();
  } catch (e) {
    $('#city-tabs').after(
      `<div class="alert alert-warning m-3">
        <strong>No data yet.</strong> Run <code>python main.py</code> to generate the data files,
        then refresh this page.
       </div>`
    );
    return;
  }

  manifest = mf;

  // Show data freshness
  const ts = new Date(mf.generated);
  $('#data-period').text(
    `Data generated: ${ts.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' })} (Taipei)`
  );

  buildTabs(mf);

  // Auto-load first city tab
  const firstCode = CITY_ORDER[0];
  loadSummary(firstCode);
});
</script>
</body>
</html>
