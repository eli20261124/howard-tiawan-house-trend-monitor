<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taiwan Real Estate — 六都趨勢雷達</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- DataTables (vanilla, no Bootstrap skin) -->
  <link href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css" rel="stylesheet" />

  <style>
    /* ── Design tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg:           #080c14;
      --bg-surface:   #0d1220;
      --glass-bg:     rgba(13, 18, 32, 0.72);
      --glass-border: rgba(0, 245, 196, 0.15);
      --glass-border-hover: rgba(0, 245, 196, 0.45);

      --neon-cyan:    #00f5c4;
      --neon-red:     #ff2d55;
      --neon-blue:    #4d9fff;
      --neon-purple:  #a259ff;

      --text-primary: #e8eaf2;
      --text-muted:   #5a6480;
      --text-dim:     #333d55;

      --sidebar-w:    220px;
      --header-h:     64px;

      /* Cell colouring */
      --rise-bg:  rgba(255, 45, 85,  0.12);
      --rise-txt: #ff6b85;
      --rise-glow: 0 0 8px rgba(255, 45, 85, 0.5);
      --fall-bg:  rgba(0,  245, 196, 0.10);
      --fall-txt: #00f5c4;
      --fall-glow: 0 0 8px rgba(0, 245, 196, 0.45);
    }

    /* ── Base ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13.5px;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated starfield background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(0,245,196,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 15%, rgba(77,159,255,.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 70%, rgba(162,89,255,.25) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 55%, rgba(255,45,85,.2) 0%, transparent 100%),
        radial-gradient(600px 600px at 10% 80%, rgba(0,245,196,.04) 0%, transparent 70%),
        radial-gradient(800px 800px at 85% 10%, rgba(77,159,255,.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout shell ──────────────────────────────────────────────────────── */
    #app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* ── Sidebar ───────────────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    #sidebar-logo {
      padding: 1.4rem 1.2rem 1rem;
      border-bottom: 1px solid var(--glass-border);
    }
    #sidebar-logo .logo-mark {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      opacity: .7;
    }
    #sidebar-logo h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-top: .25rem;
    }

    #sidebar-status {
      padding: .75rem 1.2rem;
      border-bottom: 1px solid var(--glass-border);
    }
    #sidebar-status .label {
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    #data-period {
      font-size: .72rem;
      color: var(--neon-cyan);
      margin-top: .2rem;
      line-height: 1.4;
    }

    #sidebar-nav {
      flex: 1;
      padding: .75rem 0;
    }
    #sidebar-nav .nav-section-label {
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: .5rem 1.2rem .3rem;
    }

    .city-btn {
      display: flex;
      align-items: center;
      gap: .6rem;
      width: 100%;
      padding: .6rem 1.2rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: .85rem;
      font-weight: 500;
      cursor: pointer;
      transition: color .2s, background .2s;
      text-align: left;
      position: relative;
    }
    .city-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      height: 60%;
      width: 2px;
      background: var(--neon-cyan);
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity .2s;
    }
    .city-btn:hover {
      color: var(--text-primary);
      background: rgba(0,245,196,.05);
    }
    .city-btn.active {
      color: var(--neon-cyan);
      background: rgba(0,245,196,.08);
    }
    .city-btn.active::before { opacity: 1; }

    .city-btn .city-code {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .06em;
      background: rgba(0,245,196,.12);
      color: var(--neon-cyan);
      border-radius: 3px;
      padding: .1em .4em;
      min-width: 1.6rem;
      text-align: center;
    }
    .city-btn.active .city-code {
      background: rgba(0,245,196,.22);
    }

    #sidebar-footer {
      padding: .9rem 1.2rem;
      border-top: 1px solid var(--glass-border);
      font-size: .65rem;
      color: var(--text-dim);
      line-height: 1.6;
    }
    #sidebar-footer a { color: var(--text-muted); text-decoration: none; }
    #sidebar-footer a:hover { color: var(--neon-cyan); }

    /* ── Main content ──────────────────────────────────────────────────────── */
    #main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ───────────────────────────────────────────────────────────── */
    #topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(8,12,20,.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    #topbar-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    #topbar-title span { color: var(--neon-cyan); }

    #topbar-legend {
      display: flex;
      gap: 1.2rem;
      font-size: .7rem;
      font-weight: 500;
    }
    .legend-item { display: flex; align-items: center; gap: .35rem; }
    .legend-dot {
      width: 7px; height: 7px; border-radius: 50%;
    }
    .legend-dot.rise { background: var(--neon-red); box-shadow: 0 0 6px var(--neon-red); }
    .legend-dot.fall { background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); }
    .legend-item.rise { color: var(--rise-txt); }
    .legend-item.fall { color: var(--fall-txt); }

    /* ── Content area ──────────────────────────────────────────────────────── */
    #content { flex: 1; padding: 1.5rem; }

    /* ── Glass card ────────────────────────────────────────────────────────── */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.25rem;
      transition: border-color .25s;
    }
    .glass-card:hover { border-color: var(--glass-border-hover); }

    /* ── DataTables controls row ───────────────────────────────────────────── */
    .dt-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: .75rem;
    }

    /* ── Section header ────────────────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: .95rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .section-title::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 1em;
      background: linear-gradient(180deg, var(--neon-cyan), var(--neon-blue));
      border-radius: 2px;
    }
    .section-hint {
      font-size: .7rem;
      color: var(--text-muted);
    }

    /* ── Spinner ───────────────────────────────────────────────────────────── */
    .spinner-wrap {
      text-align: center;
      padding: 3.5rem 1rem;
      color: var(--text-muted);
      font-size: .85rem;
    }
    .spinner-ring {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid rgba(0,245,196,.15);
      border-top-color: var(--neon-cyan);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: .75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Detail panel ──────────────────────────────────────────────────────── */
    #detail-table-wrap { display: none; margin-top: 1.25rem; }
    #detail-title {
      font-size: .9rem;
      font-weight: 600;
      color: var(--neon-cyan);
      margin-bottom: .75rem;
      letter-spacing: .02em;
    }

    /* ── Back button ───────────────────────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .35rem .85rem;
      font-family: inherit;
      font-size: .75rem;
      font-weight: 600;
      color: var(--neon-cyan);
      background: rgba(0,245,196,.08);
      border: 1px solid rgba(0,245,196,.3);
      border-radius: 6px;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      margin-bottom: .9rem;
    }
    .back-btn:hover {
      background: rgba(0,245,196,.15);
      border-color: rgba(0,245,196,.6);
    }

    /* ── Error / no-data banner ────────────────────────────────────────────── */
    .alert-dark {
      background: rgba(255,45,85,.08);
      border: 1px solid rgba(255,45,85,.3);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: var(--rise-txt);
      font-size: .82rem;
      line-height: 1.6;
    }
    .alert-dark code {
      background: rgba(255,255,255,.07);
      padding: .1em .4em;
      border-radius: 3px;
      font-size: .85em;
    }

    /* ── DataTables dark override ──────────────────────────────────────────── */
    table.dataTable { border-collapse: collapse !important; width: 100% !important; }

    /* Wrapper */
    .dataTables_wrapper {
      color: var(--text-primary);
      font-size: .82rem;
    }

    /* Controls row */
    .dataTables_wrapper .dataTables_length,
    .dataTables_wrapper .dataTables_filter,
    .dataTables_wrapper .dataTables_info,
    .dataTables_wrapper .dataTables_paginate {
      color: var(--text-muted);
      padding: .4rem 0;
    }
    .dataTables_wrapper .dataTables_filter input,
    .dataTables_wrapper .dataTables_length select {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px;
      color: var(--text-primary);
      padding: .3rem .6rem;
      font-family: inherit;
      font-size: .8rem;
      outline: none;
      transition: border-color .2s;
    }
    .dataTables_wrapper .dataTables_filter input:focus,
    .dataTables_wrapper .dataTables_length select:focus {
      border-color: rgba(0,245,196,.5);
      box-shadow: 0 0 0 3px rgba(0,245,196,.08);
    }
    .dataTables_wrapper .dataTables_filter label,
    .dataTables_wrapper .dataTables_length label { color: var(--text-muted); }

    /* Pagination */
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      display: inline-block;
      padding: .25rem .6rem;
      border-radius: 5px;
      cursor: pointer;
      color: var(--text-muted) !important;
      font-size: .75rem;
      background: transparent;
      border: 1px solid transparent;
      transition: all .15s;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
      color: var(--neon-cyan) !important;
      background: rgba(0,245,196,.08) !important;
      border-color: rgba(0,245,196,.3) !important;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.current,
    .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
      color: var(--neon-cyan) !important;
      background: rgba(0,245,196,.14) !important;
      border-color: rgba(0,245,196,.4) !important;
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button.disabled,
    .dataTables_wrapper .dataTables_paginate .paginate_button.disabled:hover {
      color: var(--text-dim) !important;
      background: transparent !important;
      cursor: default;
    }

    /* Table header */
    table.dataTable thead th {
      background: rgba(0,245,196,.05);
      border-bottom: 1px solid rgba(0,245,196,.18) !important;
      color: var(--neon-cyan);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .65rem .75rem;
      white-space: nowrap;
    }
    table.dataTable thead th.sorting,
    table.dataTable thead th.sorting_asc,
    table.dataTable thead th.sorting_desc { cursor: pointer; }
    table.dataTable thead th.sorting_asc::after  { content: ' ↑'; opacity: .8; }
    table.dataTable thead th.sorting_desc::after { content: ' ↓'; opacity: .8; }
    table.dataTable thead th.sorting::after      { content: ' ⇅'; opacity: .3; font-size: .7em; }

    /* Table body */
    table.dataTable tbody tr {
      background: transparent;
      transition: background .15s;
    }
    table.dataTable tbody tr:nth-child(odd)  { background: rgba(255,255,255,.018); }
    table.dataTable tbody tr:nth-child(even) { background: rgba(255,255,255,.008); }
    table.dataTable tbody tr:hover td        { background: rgba(0,245,196,.04) !important; }

    table.dataTable tbody td {
      border-bottom: 1px solid rgba(255,255,255,.04) !important;
      padding: .55rem .75rem;
      color: var(--text-primary);
      vertical-align: middle;
    }

    /* Remove default DataTables borders */
    table.dataTable,
    table.dataTable thead th,
    table.dataTable tbody td { border-left: none !important; border-right: none !important; }
    table.dataTable.no-footer { border-bottom: 1px solid rgba(255,255,255,.06) !important; }

    /* ── Conditional cells ─────────────────────────────────────────────────── */
    .cell-rise {
      background: var(--rise-bg) !important;
      color: var(--rise-txt) !important;
      font-weight: 600;
      text-shadow: var(--rise-glow);
    }
    .cell-fall {
      background: var(--fall-bg) !important;
      color: var(--fall-txt) !important;
      font-weight: 600;
      text-shadow: var(--fall-glow);
    }

    /* ── District link ─────────────────────────────────────────────────────── */
    .district-link {
      cursor: pointer;
      color: var(--neon-blue);
      text-decoration: none;
      border-bottom: 1px dashed rgba(77,159,255,.35);
      transition: color .15s, border-color .15s, text-shadow .15s;
    }
    .district-link:hover {
      color: var(--neon-cyan);
      border-color: rgba(0,245,196,.5);
      text-shadow: 0 0 8px rgba(0,245,196,.5);
    }

    /* ── Mobile hamburger ──────────────────────────────────────────────────── */
    #menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid rgba(0,245,196,.3);
      border-radius: 6px;
      color: var(--neon-cyan);
      padding: .3rem .55rem;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    /* ── Responsive ────────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 100%; }

      #app { flex-direction: column; }

      #sidebar {
        width: 100%;
        min-height: unset;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
      }

      #sidebar-nav { padding: 0; }

      .city-btn-list {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding: .5rem .75rem;
        gap: .4rem;
        scrollbar-width: none;
      }
      .city-btn-list::-webkit-scrollbar { display: none; }

      .city-btn {
        flex-shrink: 0;
        border-radius: 20px;
        border: 1px solid rgba(0,245,196,.2);
        padding: .35rem .85rem;
        font-size: .78rem;
        white-space: nowrap;
      }
      .city-btn::before { display: none; }
      .city-btn.active {
        background: rgba(0,245,196,.12);
        border-color: rgba(0,245,196,.55);
      }

      #sidebar-logo, #sidebar-status, #sidebar-footer { display: none; }
      #sidebar-nav .nav-section-label { display: none; }

      #topbar-legend { display: none; }
      #topbar { padding: 0 1rem; }

      #content { padding: .9rem; }

      .glass-card { padding: .9rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="sidebar-logo">
      <div class="logo-mark">Real Estate Radar</div>
      <h2>六都趨勢<br>監測系統</h2>
    </div>

    <div id="sidebar-status">
      <div class="label">Last Updated</div>
      <div id="data-period">—</div>
    </div>

    <nav id="sidebar-nav">
      <div class="nav-section-label">Six Major Cities</div>
      <div class="city-btn-list" id="city-nav"></div>
    </nav>

    <div id="sidebar-footer">
      Source: MOI 內政部<br>實價登錄資料<br>
      Auto-updated by <a href="https://github.com" target="_blank">GitHub Actions</a>
    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <div id="main">

    <!-- Top bar -->
    <header id="topbar">
      <div id="topbar-title">
        🏙 Taiwan Real Estate &nbsp;<span>六都趨勢雷達</span>
      </div>
      <div id="topbar-legend">
        <div class="legend-item rise">
          <span class="legend-dot rise"></span> Price ↑ QoQ/YoY
        </div>
        <div class="legend-item fall">
          <span class="legend-dot fall"></span> Price ↓ QoQ/YoY
        </div>
      </div>
    </header>

    <!-- Content -->
    <div id="content">

      <!-- Summary card -->
      <div class="glass-card" id="summary-card">
        <div class="section-header">
          <div class="section-title" id="summary-title">District Trend Summary</div>
          <div class="section-hint">Click a district name to drill into transaction details</div>
        </div>
        <div id="city-tab-content">
          <div class="spinner-wrap">
            <div class="spinner-ring"></div><br>Loading…
          </div>
        </div>
      </div>

      <!-- Detail drill-down -->
      <div id="detail-table-wrap">
        <button class="back-btn" id="back-btn">← Back to Summary</button>
        <div class="section-title" id="detail-title" style="margin-bottom:.75rem"></div>
        <div class="glass-card">
          <table id="detail-table" class="dataTable no-footer" style="width:100%">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

    </div><!-- /content -->

  </div><!-- /main -->
</div><!-- /app -->

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
/* ── Utility ────────────────────────────────────────────────────────────── */

/** Parse a CSV URL and return Promise<array of objects> */
function loadCSV(url) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download:       true,
      header:         true,
      skipEmptyLines: true,
      complete: r => resolve(r.data),
      error:    e => reject(e),
    });
  });
}

/** Format a number with 2 decimal places, or '—' if missing. */
function fmt(v, decimals = 2) {
  const n = parseFloat(v);
  return isNaN(n) ? '—' : n.toFixed(decimals);
}

/** Build a CSS class for a growth-rate cell. */
function growthClass(v) {
  const n = parseFloat(v);
  if (isNaN(n) || n === 0) return '';
  return n > 0 ? 'cell-rise' : 'cell-fall';
}

/** Format a growth percentage with sign, or '—'. */
function fmtPct(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
}

/* ── Globals ─────────────────────────────────────────────────────────────── */

let manifest = null;
let summaryDT = null;    // active DataTables instance for summary
let detailDT  = null;    // active DataTables instance for detail
let activeCity = null;   // currently selected city folder name

/* ── Summary table ──────────────────────────────────────────────────────── */

function buildSummaryColumns(sample) {
  /* Detect which growth columns exist in the data */
  const keys   = Object.keys(sample || {});
  const hasQoQ = keys.includes('QoQ_pct');
  const hasYoY = keys.includes('YoY_pct');

  const cols = [
    {
      title: 'District 行政區',
      data:  'District',
      render: (d) =>
        `<span class="district-link" data-district="${encodeURIComponent(d)}">${d}</span>`,
    },
    { title: 'Quarter 季度',         data: 'Quarter' },
    {
      title: 'Avg Price/Ping<br><small>萬/坪</small>',
      data:  'AvgPricePerPing',
      render: d => fmt(d),
    },
    {
      title: 'Transactions<br><small>成交件數</small>',
      data:  'TransactionCount',
      render: d => fmt(d, 0),
    },
  ];

  if (hasQoQ) {
    cols.push({
      title: 'QoQ 季增率',
      data:  'QoQ_pct',
      render: d => fmtPct(d),
      createdCell(td, cellData) {
        const cls = growthClass(cellData);
        if (cls) $(td).addClass(cls);
      },
    });
  }
  if (hasYoY) {
    cols.push({
      title: 'YoY 年增率',
      data:  'YoY_pct',
      render: d => fmtPct(d),
      createdCell(td, cellData) {
        const cls = growthClass(cellData);
        if (cls) $(td).addClass(cls);
      },
    });
  }
  return cols;
}

async function loadSummary(cityCode) {
  const city = manifest.cities[cityCode];
  activeCity = city.folder;

  // Update sidebar active state
  $('.city-btn').removeClass('active');
  $(`.city-btn[data-city-code="${cityCode}"]`).addClass('active');

  // Update section title
  $('#summary-title').text(`${city.name} — District Trend Summary`);

  const wrap = $('#city-tab-content');
  wrap.html(`<div class="spinner-wrap"><div class="spinner-ring"></div><br>Loading ${city.name}…</div>`);

  // Destroy previous instance to avoid DataTables id conflicts
  if (summaryDT) {
    summaryDT.destroy();
    summaryDT = null;
  }

  let rows;
  try {
    rows = await loadCSV(`data/${city.folder}/summary.csv`);
  } catch (e) {
    wrap.html(`<div class="alert-dark">No data for ${city.name}. Run <code>python main.py</code> first, then refresh.</div>`);
    return;
  }

  if (!rows.length) {
    wrap.html(`<div class="alert-dark">Summary file is empty for ${city.name}.</div>`);
    return;
  }

  const tableId = `tbl-${city.folder}`;
  wrap.html(`
    <table id="${tableId}" style="width:100%"></table>
    <p style="margin-top:.6rem;font-size:.7rem;color:var(--text-muted)">
      Click a district name to drill into transaction details.
    </p>
  `);

  const cols = buildSummaryColumns(rows[0]);

  summaryDT = $(`#${tableId}`).DataTable({
    data:      rows,
    columns:   cols,
    order:     [[1, 'desc'], [0, 'asc']],
    pageLength: 25,
    dom: '<"dt-controls"lf>rtp',
    language: { search: '🔍', searchPlaceholder: 'Search district…', lengthMenu: 'Show _MENU_' },
  });
}

/* ── Detail drill-down ───────────────────────────────────────────────────── */

function buildDetailColumns(sample) {
  const map = {
    District:          'District 行政區',
    Road:              'Road 道路',
    Floor:             'Floor 樓層',
    FloorCategory:     'Tier 樓層類別',
    BuildingType:      'Type 建物型態',
    TotalPrice_10kTWD: 'Total Price 總價(萬)',
    PricePerPing:      'Price/Ping 萬/坪',
    Quarter:           'Quarter 季度',
    Status:            'Status 狀態',
  };
  return Object.entries(map)
    .filter(([k]) => k in sample)
    .map(([k, title]) => ({
      title,
      data: k,
      render: ['TotalPrice_10kTWD', 'PricePerPing'].includes(k)
        ? d => fmt(d)
        : d => (d == null || d === '' ? '—' : d),
    }));
}

async function loadDetail(cityFolder, districtEncoded) {
  const district = decodeURIComponent(districtEncoded);
  $('#detail-title').text(`${cityFolder} › ${district} — Transaction Details`);
  $('#detail-table-wrap').show();
  $('html, body').animate({ scrollTop: $('#detail-table-wrap').offset().top - 60 }, 300);

  if (detailDT) {
    detailDT.destroy();
    detailDT = null;
    $('#detail-table thead').empty();
    $('#detail-table tbody').empty();
  }

  let rows;
  try {
    rows = await loadCSV(`data/${cityFolder}/${districtEncoded}.csv`);
  } catch (e) {
    $('#detail-table-wrap').hide();
    alert(`Could not load detail data for ${district}.`);
    return;
  }

  if (!rows.length) {
    $('#detail-table tbody').html('<tr><td colspan="9">No records found.</td></tr>');
    return;
  }

  const cols = buildDetailColumns(rows[0]);

  detailDT = $('#detail-table').DataTable({
    data:      rows,
    columns:   cols,
    order:     [],
    pageLength: 25,
    dom: '<"dt-controls"lf>rtp',
    language:  { search: '🔍', searchPlaceholder: 'Search…', lengthMenu: 'Show _MENU_' },
  });
}

/* ── Sidebar nav setup ───────────────────────────────────────────────────── */

const CITY_ORDER = ['A', 'F', 'H', 'B', 'D', 'E'];

function buildSidebar(mf) {
  const nav = $('#city-nav');
  CITY_ORDER.forEach((code) => {
    const city = mf.cities[code];
    nav.append(`
      <button class="city-btn" data-city-code="${code}">
        <span class="city-code">${code}</span>
        ${city.name}
      </button>
    `);
  });
}

/* ── Event delegation ────────────────────────────────────────────────────── */

// City nav button click
$(document).on('click', '.city-btn', function () {
  const code = $(this).data('city-code');
  $('#detail-table-wrap').hide();
  loadSummary(code);
});

// Drill into district detail when a district link is clicked
$(document).on('click', '.district-link', function () {
  const district = $(this).data('district');
  if (activeCity) loadDetail(activeCity, district);
});

// Back to summary
$('#back-btn').on('click', () => {
  $('#detail-table-wrap').hide();
  $('html, body').animate({ scrollTop: 0 }, 200);
});

/* ── Bootstrap ───────────────────────────────────────────────────────────── */

$(async function () {
  let mf;
  try {
    const resp = await fetch('data/manifest.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    mf = await resp.json();
  } catch (e) {
    $('#city-tab-content').html(
      `<div class="alert-dark">
        <strong>No data yet.</strong><br>
        Run <code>python main.py</code> to generate data files, then refresh.
       </div>`
    );
    return;
  }

  manifest = mf;

  // Show data freshness
  const ts = new Date(mf.generated);
  $('#data-period').text(
    ts.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
  );

  buildSidebar(mf);

  // Auto-load first city
  loadSummary(CITY_ORDER[0]);
});
</script>
