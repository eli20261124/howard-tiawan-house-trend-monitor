name: Update Real Estate Data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write  # required to commit updated data back to the repo
  pages: write     # required for GitHub Pages deployment
  id-token: write  # required for OIDC-based Pages deployment

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find data/processed -name "*.json" | xargs git add --
          git diff --staged --quiet \
            || git commit -m "auto: refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
